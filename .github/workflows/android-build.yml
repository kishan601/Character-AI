name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm install

      - name: Build React Frontend
        working-directory: ./client
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: ./client
        run: npx @capacitor/cli sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle executable
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aegis-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
